services:
    lifreshdb:
        # 컨테이너 이름 지정
        container_name: lifreshdb
        # 이미지 지정 - Official Images로 컨테이너를 생성
        image: mysql:8.0
        restart: always
        environment:
            MYSQL_DATABASE: lifresh
            MYSQL_USER: lifresh
            MYSQL_PASSWORD: lifresh
            MYSQL_ROOT_PASSWORD: lifresh
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 500M
        # 호스트에 있는 폴더를 컨테이너 안에 있는 폴더로 마운트
        volumes:
            - ./mysql/conf.d:/etc/mysql/conf.d
            - ./mysql/data:/var/lib/mysql
            - ./mysql/init.d:/docker-entrypoint-initdb.d
        # 연결 포트 지정
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plifresh"]
            interval: 5s
            timeout: 3s
            retries: 20
    lifreshredis:
        image: redis:latest
        container_name: lifreshredis
        hostname: redis
        ports:
            - 6379:6379
        volumes:
            - ./redis/data:/var/lib/redis:rw
        restart: always
        environment:
            REDIS_DATABASE: test
            REDIS_USER: test
            REDIS_PASSWORD: 1234
            REDIS_ROOT_PASSWORD: 1234


    lifreshapp:
        container_name: lifreshapp
        # volumes:
        #     - ./go:/go
        build:
            context: ./go
            dockerfile: dockerfile
        ports:
            - 8000:8000
        # db 컨테이너가 올라간 후 app 컨테이너를 올린다.
        depends_on:
            lifreshdb:
                condition: service_healthy
            lifreshredis:
                condition: service_started
            # - fluentd-client
        environment:
            - GOOGLE_OAUTH_CLIENT_IDS=183293757909-a4b1nh40l3ef0e5eclvu1smht3mremo3.apps.googleusercontent.com,183293757909-tt2er27edmj1cj6kplkikdb5vljlktoj.apps.googleusercontent.com,183293757909-v14ius78jb8p6onuji6jsa82k0ljnu6l.apps.googleusercontent.com
        extra_hosts:
            - host.docker.internal:host-gateway

