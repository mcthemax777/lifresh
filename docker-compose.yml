    lifreshweb:
        container_name: lifreshweb
        build:
            context: ./nginx
            dockerfile: dockerfile
        depends_on:
            - lifreshapp
        volumes:
            - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
            - ./certbot/www:/var/www/certbot
            - ./certbot/conf:/etc/letsencrypt
        ports:
            - "80:80"
            - "443:443"
        links:
            - lifreshapp
        restart: always

