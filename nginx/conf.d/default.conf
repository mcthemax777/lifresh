# ===============================
# lifresh.me Nginx (Cache-busting with hashed filenames)
# ===============================

# 백엔드 업스트림
upstream app {
    server lifreshapp:8000;
    keepalive 32;
}

# ---- 해시 파일 판별(map) ----
# 예) main.84ab3f1.js / app-0f3a9c12.css / image.f1a2b3c4.png
# (필요에 따라 정규식 수정 가능: 하이픈(-hash.) 패턴 등)
map $uri $is_hashed {
    default 0;
    ~*\.(?:[0-9a-f]{8,})\.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|ttf|otf|woff|woff2)$ 1;
}
map $is_hashed $cache_control_static {
    1 "public, max-age=31536000, immutable";   # 해시된 파일: 1년 + immutable
    0 "public, max-age=3600";                  # 해시 없는 정적: 1시간
}

# -------- 80 포트: 인증/리다이렉트 --------
server {
    listen 80;
    server_name lifresh.me www.lifresh.me;

    # ACME 챌린지 (certbot 웹루트)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 나머지는 HTTPS로 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/access-portus.log;
    error_log  /var/log/nginx/error-portus.log;
}

# -------- 443 포트: SSL + 캐시 전략 + 프록시 --------
server {
    listen 443 ssl;
    http2 on;
    server_name lifresh.me www.lifresh.me;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/lifresh.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifresh.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- 보안 헤더 ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP는 우선 Report-Only로 적용 (문제 없으면 Enforce로 전환)
    add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob:; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # --- gzip 압축 ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # -------- 캐시 정책 --------
    # 1) HTML은 캐시 금지 (SPA 진입 문서)
    location ~* \.html?$ {
        add_header Cache-Control "no-store" always;
        # 디스크에 없더라도 앱으로 넘겨서 렌더/서빙
        try_files $uri @app;
    }

    # 2) 정적 확장자 (파일명에 해시가 있으면 1년, 아니면 1시간)
    #    - 실제 파일이 Nginx 컨테이너에 없어도 try_files가 @app으로 넘깁니다.
    location ~* \.(?:css|js|mjs|json|png|jpg|jpeg|gif|webp|svg|ico|ttf|otf|woff|woff2)$ {
        # 필요 시, 백엔드의 Cache-Control/Expires를 무시하려면 아래 주석 해제:
        # proxy_hide_header Cache-Control;
        # proxy_hide_header Expires;
        add_header Cache-Control $cache_control_static always;
        try_files $uri @app;
    }

    # 3) 나머지 모든 요청은 앱으로 프록시
    location / {
        return 302 /;  # 모든 경로를 HTML 진입으로 유도하고 싶다면 이 줄을 지우고 아래 @app 프록시를 기본으로 사용
    }

    # -------- 공통 @app 프록시 --------
    location @app {
        proxy_pass http://app;
        proxy_http_version 1.1;

        # 표준 프록시 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout   60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout   60s;
    }

    client_max_body_size 20m;

    access_log /var/log/nginx/access-portus.log;
    error_log  /var/log/nginx/error-portus.log;
}
