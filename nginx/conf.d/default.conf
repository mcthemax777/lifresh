# ===============================
# lifresh.me Nginx 프록시 설정 (방법 A)
# - 80: ACME 챌린지 + HTTPS로 리다이렉트
# - 443: SSL 종료 + lifreshapp:8000으로 프록시
# - 정적 캐시 location은 제거(모든 요청을 앱으로 전달)
# ===============================

# 백엔드 업스트림(같은 도커 네트워크의 lifreshapp:8000)
upstream app {
    server lifreshapp:8000;
    keepalive 32;  # 프록시 커넥션 재사용
}

# -------- 80 포트: 인증용/리다이렉트 --------
server {
    listen 80;
    server_name lifresh.me www.lifresh.me;

    # (필수) Let's Encrypt HTTP-01 챌린지 파일을 이 경로로 노출
    # certbot 컨테이너와 nginx가 /var/www/certbot 볼륨을 공유해야 함
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 나머지 모든 HTTP 요청은 HTTPS로 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/access-portus.log;
    error_log  /var/log/nginx/error-portus.log;
}

# -------- 443 포트: SSL + 프록시 --------
server {
    # Nginx 최신(1.27+) 권장 표기: listen에서 http2 제거, 별도 지시어 사용
    listen 443 ssl;
    http2 on;
    server_name lifresh.me www.lifresh.me;

    # (필수) certbot이 발급한 인증서 경로 (docker-compose로 /etc/letsencrypt 마운트)
    ssl_certificate     /etc/letsencrypt/live/lifresh.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifresh.me/privkey.pem;

    # 최소 권장 TLS 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ---- 보안 헤더 ----
    # HTTP Strict Transport Security: 브라우저가 항상 HTTPS로 접속
    # (수 주 안정화 후 preload 옵션 추가 고려: ; preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 클릭재킹 방지: iframe으로 로드 금지
    add_header X-Frame-Options "DENY" always;

    # MIME 스니핑 방지
    add_header X-Content-Type-Options "nosniff" always;

    # 리퍼러 정책(보안/편의 균형)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 브라우저 권한 제한(필요한 것만 허용)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 컨텐츠 보안정책(CSP) - 우선 보고 전용(깨짐 여부 점검용)
    # 정상 동작 확인 후 Report-Only를 지우고 Enforce 모드로 전환 권장
    add_header Content-Security-Policy-Report-Only "default-src 'self' https: data: blob:; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ---- gzip 압축 ----
    # 텍스트/JS/JSON/SVG 등의 전송 크기 감소(백엔드 응답에도 적용됨)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ---- 앱 프록시 ----
    # 정적 캐시 location을 제거하고, 모든 요청을 백엔드로 전달
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        # 표준 프록시 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 커넥션/타임아웃 기본값(서비스 성격에 맞게 조정 가능)
        proxy_set_header Connection "";
        proxy_read_timeout   60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout   60s;
    }

    # 업로드 용량 제한(필요 시 조정)
    client_max_body_size 20m;

    access_log /var/log/nginx/access-portus.log;
    error_log  /var/log/nginx/error-portus.log;
}
